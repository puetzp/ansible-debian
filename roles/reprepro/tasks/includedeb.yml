---
- name: Copy DEB package
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tmp
    owner: "{{ reprepro_user }}"
    group: "{{ reprepro_user }}"
    mode: '0644'
  loop: "{{ _reprepro_includedeb.value }}"
  register: _reprepro_includedeb_copy_result

- name: Include DEB package
  become: true
  become_user: "{{ reprepro_user }}"
  become_method: su
  ansible.builtin.command:
    cmd: "reprepro --basedir {{ reprepro_basedir }} includedeb {{ _reprepro_includedeb.key }} {{ item.dest }}"
  loop: "{{ _reprepro_includedeb_copy_result.results }}"

- name: Delete DEB package
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ _reprepro_includedeb_copy_result.results }}"
